name: Quran Ahmed Akl test APK

on:
  push:
    branches:
      - quran-ahmed-akl-test-2026-10-22
    paths:
      - 'quran-ahmed-akl-preview/**'
      - '.github/workflows/quran-ahmed-akl-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: quran-ahmed-akl-preview
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build separate debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Ahmed-Akl-Test-APK
          path: quran-ahmed-akl-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
