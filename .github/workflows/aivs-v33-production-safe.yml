name: AIVS V33 Production Safe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aivs-v33-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.AIVS_CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.AIVS_CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Require dedicated AIVS Pages credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "AIVS_PAGES_TOKEN_MISSING"; exit 11; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "AIVS_ACCOUNT_ID_MISSING"; exit 12; }
          echo "AIVS_PAGES_CREDENTIALS=LOADED"

      - name: Prepare fail-closed deployer
        shell: bash
        run: |
          mkdir -p "$HOME/aivs-v33-tools"
          cp production-integration/v33-sales-ctr/v33_production_overlay_worker.js "$HOME/aivs-v33-tools/"
          cp production-integration/v33-sales-ctr/deploy_v33_production_safe.py "$HOME/aivs-v33-tools/"
          cp production-integration/v33-sales-ctr/rollback_v33.py "$HOME/aivs-v33-tools/"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" > "$HOME/.aivs-v33-account-id"

      - name: Deploy V33 with live QA and automatic rollback
        shell: bash
        run: |
          python "$HOME/aivs-v33-tools/deploy_v33_production_safe.py" | tee "$RUNNER_TEMP/aivs-v33-production.txt"
          grep -q '^PRODUCTION_V33=SUCCESS$' "$RUNNER_TEMP/aivs-v33-production.txt"
          grep -q '^QA_7_OF_7=PASS$' "$RUNNER_TEMP/aivs-v33-production.txt"
          grep -q '^NON_TARGET_CONTROL=PASS$' "$RUNNER_TEMP/aivs-v33-production.txt"
          grep -q '^NO_NOINDEX=PASS$' "$RUNNER_TEMP/aivs-v33-production.txt"
          grep -q '^ROLLBACK_READY=YES$' "$RUNNER_TEMP/aivs-v33-production.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "AI Video Signal V33 Production Safe" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/aivs-v33-production.txt" ]; then
            cat "$RUNNER_TEMP/aivs-v33-production.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production deployment did not start." >> "$GITHUB_STEP_SUMMARY"
          fi
