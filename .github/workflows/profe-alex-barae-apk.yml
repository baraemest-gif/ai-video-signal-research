name: Profe Alex Barae APK
on:
  push:
    branches: [main]
    paths:
      - 'android/profe-alex-barae/**'
      - '.github/workflows/profe-alex-barae-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Compilar APK para Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android/profe-alex-barae
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar Android SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Instalar Android 35
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK firmado de prueba
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Profe-Alex-Barae-Android-APK
          path: android/profe-alex-barae/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
