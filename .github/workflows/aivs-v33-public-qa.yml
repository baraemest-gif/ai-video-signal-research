name: AIVS V33 Public QA

on:
  push:
    branches:
      - aivs-v33-sales-ctr-preview-tools
    paths:
      - ".github/workflows/aivs-v33-public-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Full public QA
        shell: bash
        run: |
          set -euo pipefail
          preview="https://b001b6aa.ai-video-signal.pages.dev"
          prod="https://57ec6ea9.ai-video-signal.pages.dev"

          check_target () {
            p="$1"
            marker="$2"
            curl -sS -D /tmp/h "$preview$p" -o /tmp/b
            grep -qi '^HTTP/2 200' /tmp/h
            grep -qi '^x-aivs-v33-status: patched-v5' /tmp/h
            grep -qi '^x-robots-tag: noindex, nofollow' /tmp/h
            grep -Fq "https://aivideosignal.com$p" /tmp/b
            grep -Fq "$marker" /tmp/b
            echo "PASS $p"
          }

          check_target "/elevenlabs-cancellation-refund-policy/" "ElevenLabs Refund Policy 2026: 14-Day Rule, Cancellation"
          check_target "/filmora-free-vs-paid/" "Filmora Free vs Paid 2026: Watermark, Price"
          check_target "/best-ai-video-tools-for-compliance-training/" "Compare AI compliance video tools for policy/SOP training"
          check_target "/filmora-free-trial/" "Filmora free trial guide for 2026"
          check_target "/ai-video-pricing-benchmarks/" "compare AI video generators by workflow and pricing"
          check_target "/ai-video-annual-vs-monthly-pricing-comparison/" "compare the leading AI video generators before choosing a billing term"
          check_target "/ai-video-credits-usage-comparison/" "compare AI video generators by pricing model and workflow"

          for p in "/" "/best-ai-video-generators/" "/assets/site.js" "/assets/styles.css"
          do
            curl -sS "$preview$p" -o /tmp/preview
            curl -sS "$prod$p" -o /tmp/prod
            hp="$(sha256sum /tmp/preview | cut -d' ' -f1)"
            hu="$(sha256sum /tmp/prod | cut -d' ' -f1)"
            test "$hp" = "$hu"
            echo "IDENTICAL $p"
          done

          echo "QA_7_OF_7=PASS"
          echo "NON_TARGET_CONTROL=PASS"
          echo "PRODUCTION_UNTOUCHED=YES"
