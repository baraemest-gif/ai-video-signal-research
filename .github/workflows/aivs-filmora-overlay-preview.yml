name: AI Video Signal Filmora Overlay Preview

on:
  push:
    branches:
      - ops/aivs-filmora-overlay-20260927
    paths:
      - 'ops/aivs-filmora-overlay/**'
      - '.github/workflows/aivs-filmora-overlay-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/aivs-filmora-overlay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are configured; preview deployment is allowed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured under the standard secret names. No deployment will run."
          fi

      - name: Syntax check
        run: node --check src/index.js

      - name: Deploy workers.dev preview only
        if: steps.cf.outputs.ready == 'true'
        run: npx --yes wrangler@latest deploy --config wrangler.preview.toml

      - name: No-op when credentials are absent
        if: steps.cf.outputs.ready != 'true'
        run: echo "SAFE_NO_DEPLOY"
