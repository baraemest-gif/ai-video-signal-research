name: AIVS V33 Preview

on:
  push:
    branches:
      - aivs-v33-sales-ctr-preview-tools
    paths:
      - ".github/workflows/aivs-v33-preview.yml"
      - "production-integration/v33-sales-ctr/**"

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_TOKEN_MISSING"
            exit 11
          fi

          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from pathlib import Path

          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          preset = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          out = Path(os.environ["RUNNER_TEMP"]) / "aivs-account-id"

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "AIVS-v33-GitHub"
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode())

          candidates = []
          if preset:
              candidates.append(preset)
          else:
              try:
                  data = api("https://api.cloudflare.com/client/v4/accounts?per_page=50")
                  candidates = [x.get("id") for x in data.get("result", []) if x.get("id")]
              except Exception as e:
                  print("ACCOUNT_DISCOVERY_FAILED=" + type(e).__name__)
                  sys.exit(12)

          for aid in candidates:
              try:
                  data = api(f"https://api.cloudflare.com/client/v4/accounts/{aid}/pages/projects")
              except Exception:
                  continue
              for p in data.get("result", []):
                  if p.get("name") == "ai-video-signal":
                      out.write_text(aid)
                      print("ACCOUNT_RESOLVED=YES")
                      print("PROJECT_FOUND=ai-video-signal")
                      sys.exit(0)

          print("PROJECT_FOUND=NO")
          sys.exit(13)
          PY

          ACCOUNT_ID="$(cat "$RUNNER_TEMP/aivs-account-id")"
          echo "::add-mask::$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Prepare V33 deployer
        shell: bash
        run: |
          mkdir -p "$HOME/aivs-v33-tools"
          cp production-integration/v33-sales-ctr/v33_preview_overlay_worker.js "$HOME/aivs-v33-tools/"
          cp production-integration/v33-sales-ctr/deploy_v33_preview_overlay.py "$HOME/aivs-v33-tools/"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" > "$HOME/.aivs-v33-account-id"

      - name: Deploy V33 preview only
        shell: bash
        run: |
          python "$HOME/aivs-v33-tools/deploy_v33_preview_overlay.py" | tee "$RUNNER_TEMP/aivs-v33-deploy.txt"
          grep -q '^ENV=preview$' "$RUNNER_TEMP/aivs-v33-deploy.txt"
          grep -q '^BRANCH=v33-sales-ctr-preview$' "$RUNNER_TEMP/aivs-v33-deploy.txt"
          grep -q '^PRODUCTION_UNTOUCHED=YES$' "$RUNNER_TEMP/aivs-v33-deploy.txt"
          grep -q '^OVERLAY_VERSION=V33_V5$' "$RUNNER_TEMP/aivs-v33-deploy.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "AI Video Signal V33 Preview" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/aivs-v33-deploy.txt" ]; then
            cat "$RUNNER_TEMP/aivs-v33-deploy.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment did not start." >> "$GITHUB_STEP_SUMMARY"
          fi
