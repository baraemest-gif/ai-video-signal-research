name: Validate research data

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'evidence/**'
      - 'reconciliation/**'
      - 'reproducibility/**'
      - 'release-candidate/**'
      - 'CITATION.cff'
      - '.zenodo.json.template'
      - 'RELEASE_STATUS.md'
      - '.github/workflows/validate-research-data.yml'
  pull_request:
    paths:
      - 'datasets/**'
      - 'evidence/**'
      - 'reconciliation/**'
      - 'reproducibility/**'
      - 'release-candidate/**'
      - 'CITATION.cff'
      - '.zenodo.json.template'
      - 'RELEASE_STATUS.md'
      - '.github/workflows/validate-research-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine release phase
        id: release_phase
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('release-candidate/release-manifest.json').read_text(encoding='utf-8'))
          status = manifest.get('status')
          phase = 'published' if status == 'PUBLISHED_ZENODO_DOI' else 'prepublication'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'phase={phase}\n')
          print(f'Release phase: {phase} ({status})')
          PY

      - name: Validate provider reconciliation
        run: python reproducibility/validate_reconciliation.py

      - name: Validate release candidate
        run: python reproducibility/validate_release_candidate.py

      - name: Validate evidence coverage and relationship disclosures
        run: python reproducibility/validate_evidence_and_disclosures.py

      - name: Validate quantitative evidence coverage
        run: python reproducibility/validate_quantitative_coverage.py

      - name: Validate citation and Zenodo metadata
        run: python reproducibility/validate_metadata.py

      - name: Validate freeze integrity
        run: python reproducibility/validate_freeze_readiness.py

      - name: Enforce release state guard
        run: python reproducibility/validate_release_guard.py

      - name: Derive historical candidate metrics
        run: python reproducibility/derive_release_candidate_metrics.py

      - name: Build reproducible historical HOLD candidate package
        run: python reproducibility/build_candidate_package.py

      - name: Validate historical HOLD candidate package checksums
        run: python reproducibility/validate_candidate_package.py

      - name: Upload verified historical HOLD candidate package
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Signal-RC-2026-09-17-HOLD
          path: build/RC-2026-09-17-HOLD/
          if-no-files-found: error
          retention-days: 30

      - name: Build frozen v2026.09.17 prepublication package
        if: steps.release_phase.outputs.phase == 'prepublication'
        run: python reproducibility/build_frozen_prepublish_package.py

      - name: Validate frozen v2026.09.17 prepublication package
        if: steps.release_phase.outputs.phase == 'prepublication'
        run: python reproducibility/validate_frozen_prepublish_package.py

      - name: Upload frozen v2026.09.17 prepublication artifact
        if: steps.release_phase.outputs.phase == 'prepublication'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Signal-v2026.09.17-PREPUBLISH-${{ github.sha }}
          path: build/v2026.09.17/
          if-no-files-found: error
          retention-days: 90

      - name: Confirm post-DOI state
        if: steps.release_phase.outputs.phase == 'published'
        run: |
          echo 'Published DOI state detected. Historical prepublication artifact rebuild is intentionally skipped.'
          echo 'The authoritative published package is the Zenodo record referenced by release-manifest.json.'
