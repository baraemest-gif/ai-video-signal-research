name: Validate research data

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'evidence/**'
      - 'reconciliation/**'
      - 'reproducibility/**'
      - 'release-candidate/**'
      - 'CITATION.cff'
      - '.zenodo.json.template'
      - 'RELEASE_STATUS.md'
      - '.github/workflows/validate-research-data.yml'
  pull_request:
    paths:
      - 'datasets/**'
      - 'evidence/**'
      - 'reconciliation/**'
      - 'reproducibility/**'
      - 'release-candidate/**'
      - 'CITATION.cff'
      - '.zenodo.json.template'
      - 'RELEASE_STATUS.md'
      - '.github/workflows/validate-research-data.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate provider reconciliation
        run: python reproducibility/validate_reconciliation.py

      - name: Validate release candidate
        run: python reproducibility/validate_release_candidate.py

      - name: Validate evidence coverage and relationship disclosures
        run: python reproducibility/validate_evidence_and_disclosures.py

      - name: Validate citation and Zenodo metadata
        run: python reproducibility/validate_metadata.py

      - name: Enforce HOLD release safety guard
        run: python reproducibility/validate_release_guard.py

      - name: Derive HOLD candidate metrics
        run: python reproducibility/derive_release_candidate_metrics.py
