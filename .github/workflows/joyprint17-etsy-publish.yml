name: JoyPrint17 Etsy HVAC Publisher\n\non:\n  push:\n    branches:\n      - joyprint17-etsy-publisher\n    paths:\n      - "joyprint17/etsy-publisher/**"\n      - ".github/workflows/joyprint17-etsy-publish.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  publish:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - name: Install HTTP client\n        run: python -m pip install --disable-pip-version-check requests\n\n      - name: Publish HVAC listing to JoyPrint17\n        env:\n          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}\n          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}\n          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}\n          ETSY_HVAC_CANVA_TEMPLATE_URL: ${{ secrets.ETSY_HVAC_CANVA_TEMPLATE_URL }}\n        run: python joyprint17/etsy-publisher/publish_hvac.py\n