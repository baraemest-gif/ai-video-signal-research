name: JoyPrint17 Etsy HVAC Publisher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "joyprint17/publish-requests/hvac.txt"

permissions:
  contents: read

concurrency:
  group: joyprint17-etsy-hvac-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Generate public HVAC cover
        run: python joyprint17/etsy-publisher/generate_cover.py

      - name: Publish HVAC listing to JoyPrint17
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_HVAC_CANVA_TEMPLATE_URL: ${{ secrets.ETSY_HVAC_CANVA_TEMPLATE_URL }}
        run: python joyprint17/etsy-publisher/publish_hvac.py
