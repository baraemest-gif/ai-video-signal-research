name: APK Citas Madrid Fondo
on:
  push:
    branches: ['app/citas-huellas-android']
    paths:
      - 'citas-fondo/**'
      - '.github/workflows/citas-fondo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: citas-fondo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Citas-Madrid-Fondo-v2-APK
          path: citas-fondo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
