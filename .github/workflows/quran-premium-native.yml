name: Build Quran Premium APK

on:
  push:
    branches:
      - quran-premium-native
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tree
        shell: bash
        run: |
          base64 -d quran-premium-project.tar.gz.b64 > quran-premium-project.tar.gz
          tar -xzf quran-premium-project.tar.gz
          test -f quran-premium-android/settings.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: quran-premium-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-premium-debug-apk
          path: quran-premium-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
